<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Animator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    overflow: hidden;
  }

  .animator {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .controls {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    z-index: 5;
  }

  .control-btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .control-btn:hover { background: #30363d; border-color: #8b949e; }
  .control-btn:disabled { opacity: 0.4; cursor: default; }
  .control-btn:disabled:hover { background: #21262d; border-color: #30363d; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: #8b949e;
    text-align: center;
    padding: 40px;
  }

  .empty-state h2 { font-size: 24px; color: #f0f6fc; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.5; }

  .process-view {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  .process-title {
    font-size: 18px;
    font-weight: 600;
    color: #f0f6fc;
    padding: 12px 16px;
    border-bottom: 1px solid #30363d;
  }

  .lanes {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .lane {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #30363d;
  }

  .lane:last-child { border-right: none; }

  .lane-header {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #f0f6fc;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .lane-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    overflow-y: auto;
  }

  .step-marker {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    min-height: 32px;
    transition: all 0.3s ease;
  }

  .step-marker.owns {
    background: #21262d;
    border: 1px solid #30363d;
    color: #8b949e;
  }

  .step-marker.owns.active {
    background: #1f3a5f;
    border-color: #58a6ff;
    color: #58a6ff;
    box-shadow: 0 0 12px rgba(88, 166, 255, 0.2);
  }

  .step-marker.owns.completed {
    background: #1a3b2f;
    border-color: #3fb950;
    color: #3fb950;
  }

  .step-info {
    padding: 16px;
    background: #161b22;
    border-top: 1px solid #30363d;
    min-height: 80px;
  }

  .step-detail {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .step-type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #1f3a5f;
    color: #58a6ff;
    width: fit-content;
  }

  .step-detail h3 {
    font-size: 16px;
    color: #f0f6fc;
  }

  .step-detail p {
    font-size: 14px;
    color: #8b949e;
    line-height: 1.5;
  }
</style>
</head>
<body>
<script src="index.js"></script>
</body>
</html>
