<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Animator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    height: 100vh;
    overflow: hidden;
  }

  .animator {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    z-index: 5;
  }

  .control-btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .control-btn:hover { background: #30363d; border-color: #8b949e; }
  .control-btn:disabled { opacity: 0.4; cursor: default; }
  .control-btn:disabled:hover { background: #21262d; border-color: #30363d; }

  /* Empty & Error states */
  .empty-state, .error-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: #8b949e;
    text-align: center;
    padding: 40px;
  }

  .empty-state h2, .error-state h2 { font-size: 24px; color: #f0f6fc; margin-bottom: 8px; }
  .empty-state p, .error-state p { font-size: 14px; line-height: 1.5; }
  .error-state { color: #f85149; }
  .error-state h2 { color: #f85149; }

  /* Process view */
  .process-view {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  .process-title {
    font-size: 18px;
    font-weight: 600;
    color: #f0f6fc;
    padding: 12px 16px;
    border-bottom: 1px solid #30363d;
  }

  /* Deadline bar */
  .deadline-bar {
    padding: 8px 16px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
  }

  .deadline-label {
    font-size: 11px;
    font-weight: 600;
    color: #d29922;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .deadline-track {
    height: 6px;
    background: #21262d;
    border-radius: 3px;
    overflow: hidden;
  }

  .deadline-fill {
    height: 100%;
    background: linear-gradient(90deg, #3fb950, #d29922, #f85149);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  /* Lanes */
  .lanes-container {
    position: relative;
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  .lanes {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .lane {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #30363d;
  }

  .lane:last-child { border-right: none; }

  .lane-header {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #f0f6fc;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .lane-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    overflow-y: auto;
  }

  /* Chain state box */
  .chain-state-box {
    padding: 8px 12px;
    margin: 8px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    transition: all 0.5s ease;
  }

  .chain-state-label {
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
    text-align: center;
    transition: all 0.3s ease;
  }

  .chain-state-label.chain-state-active {
    color: #58a6ff;
    animation: state-morph 0.6s ease;
  }

  @keyframes state-morph {
    0% { transform: scaleY(0.8); opacity: 0.5; }
    50% { transform: scaleY(1.1); }
    100% { transform: scaleY(1); opacity: 1; }
  }

  /* Datum changes in chain state box */
  .datum-changes {
    margin-top: 6px;
    font-size: 10px;
  }

  .datum-change {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 0;
    animation: fade-in 0.4s ease;
  }

  .datum-field {
    color: #d2a8ff;
    font-weight: 600;
    font-family: monospace;
  }

  .datum-before { color: #f85149; text-decoration: line-through; }
  .datum-arrow { color: #8b949e; }
  .datum-after { color: #3fb950; }

  /* Step markers */
  .step-marker {
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    min-height: 32px;
    transition: all 0.3s ease;
  }

  .step-marker.owns {
    background: #21262d;
    border: 1px solid #30363d;
    color: #8b949e;
  }

  .step-marker.owns.active {
    background: #1f3a5f;
    border-color: #58a6ff;
    color: #58a6ff;
    box-shadow: 0 0 12px rgba(88, 166, 255, 0.2);
    animation: fade-in 0.3s ease;
  }

  .step-marker.owns.completed {
    background: #1a3b2f;
    border-color: #3fb950;
    color: #3fb950;
  }

  .step-marker.offchain-active {
    background: #2d1f3a;
    border-color: #d2a8ff;
    color: #d2a8ff;
    box-shadow: 0 0 12px rgba(210, 168, 255, 0.2);
  }

  /* Transaction arrows */
  .tx-arrow {
    position: absolute;
    top: 50%;
    height: 4px;
    z-index: 10;
    pointer-events: none;
    animation: arrow-fly 0.6s ease forwards;
  }

  .arrow-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: #58a6ff;
    box-shadow: 0 0 8px rgba(88, 166, 255, 0.5);
  }

  .arrow-head {
    position: absolute;
    top: -4px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }

  .tx-arrow-right .arrow-head {
    right: 0;
    border-left: 8px solid #58a6ff;
  }

  .tx-arrow-left .arrow-head {
    left: 0;
    border-right: 8px solid #58a6ff;
  }

  @keyframes arrow-fly {
    0% { opacity: 0; transform: scaleX(0); }
    50% { opacity: 1; }
    100% { opacity: 1; transform: scaleX(1); }
  }

  /* Step info panel */
  .step-info {
    padding: 16px;
    background: #161b22;
    border-top: 1px solid #30363d;
    min-height: 80px;
    max-height: 200px;
    overflow-y: auto;
  }

  .step-detail {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .step-type-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #1f3a5f;
    color: #58a6ff;
    width: fit-content;
  }

  .step-detail h3 {
    font-size: 16px;
    color: #f0f6fc;
  }

  .step-detail p {
    font-size: 14px;
    color: #8b949e;
    line-height: 1.5;
  }

  /* Signature badges */
  .sig-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .sig-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #2d1f3a;
    color: #d2a8ff;
    border: 1px solid #3d2b50;
    animation: badge-fade 0.4s ease;
  }

  @keyframes badge-fade {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Validator check ticks */
  .check-ticks {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .check-tick {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #1a3b2f;
    color: #3fb950;
    border: 1px solid #2a5a3f;
    animation: tick-appear 0.3s ease both;
  }

  @keyframes tick-appear {
    0% { opacity: 0; transform: translateY(4px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Datum change info in step panel */
  .datum-changes-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }

  .datum-change-info {
    padding: 6px 10px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 4px;
    font-size: 12px;
  }

  .datum-change-info strong {
    display: block;
    color: #f0f6fc;
    margin-bottom: 2px;
  }

  .datum-field-name {
    display: block;
    color: #d2a8ff;
    font-family: monospace;
    font-size: 11px;
    margin-bottom: 4px;
  }

  .datum-transition {
    color: #8b949e;
  }

  .datum-val-before { color: #f85149; }
  .datum-val-after { color: #3fb950; }

  /* Generic animations */
  @keyframes fade-in {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .lanes { flex-wrap: wrap; }
    .lane { min-width: 200px; border-right: none; border-bottom: 1px solid #30363d; }
    .lane:last-child { border-bottom: none; }
  }
</style>
</head>
<body>
<div id="animator"></div>
<script src="index.js"></script>
</body>
</html>
